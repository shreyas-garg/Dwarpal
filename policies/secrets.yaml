# Credentials in input and output. Output: block, a reply that leaks a key can't be trusted.
# Input: redact, so a user who pastes their own key still gets help. See docs/decisions/0004.
name: secrets
version: 1.0.1
guard: secrets
stages: [input, output]
enabled: true
mode: enforce
action: block
threshold: 0.80
tier: cheap
on_error: fail_closed     # a crashed credential filter must not wave a leak through
timeout_ms: 50
params:
  input_action: redact
  entropy:
    enabled: true
    min_length: 24          # shorter random strings are usually ids, not keys
    min_bits_base64: 4.0    # bits per char; plain words stay under, real keys go over
    min_bits_hex: 3.0       # hex has only 16 symbols, so its ceiling is 4.0
    keyword_window: 40      # chars before the token searched for "secret", "token", ...
    weight: 0.60            # random token alone: not enough to block
    weight_with_keyword: 0.90
  stopwords: [your, xxxx, changeme, placeholder, dummy, redacted, "${", "{{"]
  patterns:
    # Vendor key formats: one match blocks on its own.
    - {name: ledgerly_key, regex: '\blg_(?:live|test)_[A-Za-z0-9]{16,}\b', weight: 0.95}
    - {name: aws_access_key, regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b', weight: 0.95}
    - {name: github_token, regex: '\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{50,})\b', weight: 0.95}
    - {name: openai_key, regex: '\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_\-]{32,}\b', weight: 0.95}
    - {name: google_api_key, regex: '\bAIza[0-9A-Za-z_\-]{35}\b', weight: 0.95}
    - {name: slack_token, regex: '\bxox[abprs]-[A-Za-z0-9\-]{10,}\b', weight: 0.95}
    - {name: jwt, regex: '\beyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}', weight: 0.95}
    # The whole block, so the body and the END line go too, not just the header.
    - {name: pem_private_key, regex: '-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----[\s\S]*?(?:-----END (?:[A-Z]+ )?PRIVATE KEY-----|$)', weight: 0.95}
    # scheme://user:password@host, only the password is redacted.
    - name: url_with_password
      regex: '\b[a-z][a-z0-9+.\-]*://[^\s:/@]+:(?P<secret>[^\s@/]{3,})@'
      weight: 0.95
    # key = value or "password is value", where the value has a digit ("API key: Settings" is
    # not a secret).
    - name: secret_assignment
      regex: '(?i)\b(?:[a-z_]*(?:api[_\-]?key|secret|token|passw(?:or)?d|pwd))\b["'']?\s*(?:[:=]|\bis\b)\s*["'']?(?P<secret>(?=[^\s"'']*\d)[^\s"''<>]{8,})'
      weight: 0.90
    - {name: bearer_token, regex: '\bBearer\s+(?P<secret>[A-Za-z0-9._\-]{20,})', weight: 0.90}
changelog:
  - "1.0.0: vendor key formats, connection-string passwords, key=value assignments, entropy; block on output, redact on input"
  - "1.0.1: values split from their keyword across content parts are redacted"
