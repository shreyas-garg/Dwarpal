name: eval

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --frozen

      # Decisions are keyed by (guard, policy version, case), so unchanged guards are scored
      # once and the LLM judge (PR-06) is not paid for again on every push.
      - name: Restore eval cache
        uses: actions/cache@v4
        with:
          path: eval/.cache
          key: eval-${{ hashFiles('policies/*.yaml', 'policies/prompts/*', 'dwarpal/guards/*.py', 'eval/datasets/*.jsonl') }}
          restore-keys: eval-

      # PR-03: the input-attack guards load a pretrained classifier (~700 MB) from the HF
      # hub. Cache it so CI downloads it once, not on every push.
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('policies/*.yaml') }}
          restore-keys: hf-models-

      # Exits non-zero when a policy drops below its baseline or its threshold. The report is
      # written either way, so the table below explains a red build.
      - name: Eval
        run: make eval
        env:
          # PR-06: the faithfulness judge and the schema repair call Gemini. Decisions are cached
          # above, so only new or changed cases cost a call. Without the secret those guards fail
          # (fail_open / fail_closed) and the gate reports it rather than passing silently.
          UPSTREAM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Free-tier Gemini allows 5 requests a minute for 2.5 Flash. Pacing keeps the first
          # uncached run under it; later runs reuse eval/.cache and make almost no calls.
          GUARD_LLM_RPM: "5"

      - name: Job summary
        if: always()
        run: cat eval/reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true  # pull requests from forks get a read-only token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file eval/reports/latest.md --edit-last --create-if-none
