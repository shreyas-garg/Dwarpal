name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # PR-03: the policy version check diffs against origin/main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --frozen
      - name: Lint
        run: make lint
      # PR-03: a changed policy YAML must carry a version bump and a changelog entry.
      - name: Policy versions bumped
        run: |
          git fetch origin main --quiet
          uv run python scripts/check_policy_versions.py origin/main
      - name: Test
        run: make test
