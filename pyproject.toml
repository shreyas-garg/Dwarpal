[project]
name = "dwarpal"
version = "0.1.0"
description = "Versioned guardrails proxy for LLM apps: OpenAI-compatible, YAML policies, red-team eval gated in CI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy dependencies go in extras so the core stays light.
# Guard owners: add your libraries to the matching group in your PR.
ml = []   # transformers / onnxruntime / sentence-transformers / detoxify (PRs 03, 05)
pii = []  # presidio-analyzer / presidio-anonymizer / spacy (PR 04)

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwarpal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
